<section
  id="contactame"
  class="snap-section relative flex flex-col items-center justify-center min-h-[100dvh] px-3 sm:px-6 lg:px-8 pt-16 pb-8"
>
  <!-- Translucent Glassmorphism Card (optimized for 16:9 viewports & mobile) -->
  <div
    class="glass-card w-full max-w-5xl p-4 sm:p-6 lg:p-7 rounded-2xl border border-white/10 shadow-2xl backdrop-blur-xl flex flex-col max-h-[calc(100dvh-5rem)] overflow-y-auto transition-all duration-300"
  >
    <!-- Heading -->
    <h2
      class="text-xl sm:text-2xl lg:text-3xl font-bold tracking-tight text-[#e192ab] mb-4 sm:mb-6 drop-shadow-[2px_2px_4px_#402835]"
    >
      &gt; contact me
    </h2>

    <!-- Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-8 items-center">
      <!-- Left Column: Social & Direct Links -->
      <div class="lg:col-span-5 flex flex-col sm:flex-row lg:flex-col gap-2.5 sm:gap-3">
        @for (link of socialLinks; track link.id) {
          <a
            [href]="link.url"
            target="_blank"
            rel="noopener noreferrer"
            class="glass-btn group flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-white/10 transition-all duration-300 hover:border-[#e192ab]/60 flex-1"
          >
            <span class="text-xs sm:text-sm font-semibold text-[#ede6c8] group-hover:text-[#e192ab] transition-colors">
              {{ link.name }}
            </span>

            <div class="text-neutral-300 group-hover:text-white group-hover:scale-110 transition-all ml-2">
              @switch (link.iconType) {
                @case ('github') {
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                    />
                  </svg>
                }
                @case ('linkedin') {
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path
                      d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.53 1.53 0 0 0 1.54-1.53 1.53 1.53 0 0 0-1.54-1.54 1.53 1.53 0 0 0-1.53 1.54c0 .85.69 1.53 1.53 1.53m1.39 9.74v-8.37H5.07v8.37h2.78z"
                    />
                  </svg>
                }
                @case ('email') {
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                    />
                  </svg>
                }
              }
            </div>
          </a>
        }
      </div>

      <!-- Right Column: Translucent Info Box -->
      <div class="lg:col-span-7">
        <div
          class="glass-card-nested p-4 sm:p-6 rounded-xl border border-white/10 shadow-xl flex flex-col justify-between space-y-4"
        >
          <p class="text-xs sm:text-sm lg:text-base leading-relaxed text-[#ede6c8] drop-shadow">
            {{ profile.statusMessage }}
          </p>

          <!-- Quick email interaction -->
          <div class="flex flex-wrap items-center gap-2.5 pt-1">
            <button
              type="button"
              (click)="copyEmail()"
              class="glass-btn px-3.5 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold text-[#ede6c8] flex items-center gap-2 cursor-pointer focus:outline-none"
            >
              <svg class="w-3.5 h-3.5 text-[#d39c7c]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                />
              </svg>
              <span>{{ copied() ? 'Email copied! 🎉' : 'Copy Email Address' }}</span>
            </button>

            <a
              href="mailto:martinordovas@gmail.com"
              class="glass-btn px-3.5 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold text-[#e192ab] flex items-center gap-2 cursor-pointer"
            >
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                />
              </svg>
              Send Message
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
