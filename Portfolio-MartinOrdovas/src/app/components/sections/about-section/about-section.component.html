<section
  class="relative flex flex-col items-center justify-center w-full h-full min-h-[100dvh] px-3 sm:px-6 lg:px-8 pt-16 pb-8"
>
  <!-- Translucent Glassmorphism Card (optimized for 16:9 viewports & mobile) -->
  <div
    class="glass-card w-full max-w-5xl p-4 sm:p-6 lg:p-7 rounded-2xl border border-white/10 shadow-2xl backdrop-blur-xl flex flex-col max-h-[calc(100dvh-5rem)] overflow-y-auto transition-all duration-300"
  >
    <!-- Heading -->
    <h2
      class="text-xl sm:text-2xl lg:text-3xl font-bold tracking-tight text-[#e192ab] mb-4 sm:mb-6 drop-shadow-[2px_2px_4px_#402835]"
    >
      &gt; about me
    </h2>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-8 items-start">
      <!-- Left Column: Bio & Photo -->
      <div class="lg:col-span-7 flex flex-col justify-between space-y-4 sm:space-y-5">
        <p class="text-xs sm:text-sm lg:text-base leading-relaxed text-[#ede6c8] drop-shadow">
          {{ profile.bio }}
        </p>

        <div
          class="flex flex-col sm:flex-row items-center sm:items-start gap-4 pt-1"
        >
          <!-- Photo with grayscale-to-color hover transition -->
          <div class="relative group shrink-0">
            <img
              [src]="profile.photoUrl"
              [alt]="profile.name"
              class="w-28 h-28 sm:w-36 sm:h-36 lg:w-40 lg:h-40 object-cover rounded-xl border border-white/15 shadow-xl filter grayscale contrast-125 group-hover:grayscale-0 group-hover:scale-[1.03] transition-all duration-500 ease-out"
            />
            <div
              class="absolute inset-0 rounded-xl ring-1 ring-inset ring-white/10 pointer-events-none"
            ></div>
          </div>

          <!-- Based in info -->
          <div class="text-center sm:text-left flex flex-col justify-center sm:pt-2">
            <span
              class="text-xs uppercase tracking-widest text-[#d39c7c] font-semibold flex items-center justify-center sm:justify-start gap-1.5"
            >
              <svg
                class="w-3.5 h-3.5 text-[#d39c7c]"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
              Based in
            </span>
            <p class="mt-0.5 text-sm sm:text-base lg:text-lg font-bold text-[#ede6c8]">
              {{ profile.location }}
            </p>
          </div>
        </div>
      </div>

      <!-- Right Column: Core Tech Stack -->
      <div class="lg:col-span-5">
        <div
          class="glass-card-nested p-4 sm:p-5 rounded-xl border border-white/10 shadow-xl transition-all duration-300 hover:scale-[1.01]"
        >
          <h3
            class="text-xs sm:text-sm font-semibold tracking-widest text-[#d39c7c] uppercase mb-3"
          >
            &gt; core stack
          </h3>

          <div class="space-y-3 sm:space-y-3.5">
            @for (skill of skills; track skill.name) {
              <div class="group">
                <div class="flex items-center justify-between text-xs sm:text-sm text-[#ede6c8] mb-1">
                  <div class="flex items-center gap-2">
                    <img
                      [src]="skill.icon"
                      [alt]="skill.name"
                      class="w-4 h-4 sm:w-5 sm:h-5 object-contain transition-transform group-hover:scale-110"
                    />
                    <span class="font-medium tracking-tight group-hover:text-white transition-colors text-xs sm:text-sm">
                      {{ skill.name }}
                    </span>
                  </div>
                  <span class="text-[11px] sm:text-xs text-neutral-400 font-mono">{{ skill.percentage }}%</span>
                </div>

                <!-- Progress Bar -->
                <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                  <div
                    class="h-full bg-[#d39c7c] rounded-full transition-all duration-1000 ease-out shadow-[0_0_8px_rgba(211,156,124,0.6)]"
                    [style.width.%]="skill.percentage"
                  ></div>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
