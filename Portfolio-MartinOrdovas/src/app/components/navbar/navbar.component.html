<nav class="fixed top-0 left-0 right-0 z-50 pointer-events-none">
  <div
    class="pointer-events-auto transition-all duration-700 ease-in-out mx-auto"
    [ngClass]="{
      'w-full max-w-full rounded-none bg-slate-950/85 backdrop-blur-md border-b border-sky-500/20 shadow-2xl px-4 sm:px-6 lg:px-8': isNavbarScrolled(),
      'w-[90%] max-w-2xl mt-3 rounded-2xl glass-card border border-sky-500/35 shadow-2xl backdrop-blur-xl px-4 py-1': !isNavbarScrolled()
    }"
  >
    <div class="flex items-center justify-between" [class.h-11]="!isNavbarScrolled()" [class.h-16]="isNavbarScrolled()">
      <!-- Terminal / Logo brand -->
      <a
        (click)="onNavigate('inicio', $event)"
        href="#inicio"
        class="group flex items-center gap-2 text-xs sm:text-sm font-semibold tracking-wider text-[#f1f5f9] hover:text-[#38bdf8] transition-colors cursor-pointer select-none"
      >
        <span class="inline-block w-2 h-3.5 bg-[#38bdf8] animate-pulse shadow-[0_0_8px_#38bdf8]"></span>
        <span class="text-[11px] sm:text-xs uppercase tracking-widest text-[#93c5fd]">martin</span>
        <span class="text-[11px] sm:text-xs text-neutral-400 group-hover:text-white">portfolio</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-6">
        @for (item of navItems; track item.id) {
          <a
            (click)="onNavigate(item.id, $event)"
            [href]="item.href"
            class="relative py-1 text-sm font-medium tracking-wide transition-colors cursor-pointer"
            [class.text-[#38bdf8]]="scrollService.activeSection() === item.id"
            [class.text-neutral-400]="scrollService.activeSection() !== item.id"
            [class.hover:text-[#f1f5f9]]="scrollService.activeSection() !== item.id"
          >
            {{ item.label }}
            <!-- Active underline bar -->
            <span
              class="absolute bottom-0 left-0 h-[2px] bg-[#38bdf8] shadow-[0_0_8px_#38bdf8] transition-all duration-300 rounded-full"
              [class.w-full]="scrollService.activeSection() === item.id"
              [class.w-0]="scrollService.activeSection() !== item.id"
            ></span>
          </a>
        }
      </div>

      <!-- Mobile Hamburger Toggle -->
      <div class="flex md:hidden">
        <button
          (click)="toggleMobileMenu()"
          type="button"
          class="p-1.5 rounded-lg text-neutral-300 hover:text-white focus:outline-none focus:ring-1 focus:ring-[#38bdf8] transition-colors"
          aria-label="Abrir menú de navegación"
        >
          <svg
            class="w-5 h-5 transition-transform duration-300 ease-out"
            [class.rotate-90]="isMobileMenuOpen()"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            @if (!isMobileMenuOpen()) {
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            } @else {
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Dropdown Menu with smooth height transition & matching glassmorphism -->
  <div
    class="md:hidden mobile-menu-wrapper border-sky-500/25 mx-auto"
    [ngClass]="{
      'w-full': isNavbarScrolled(),
      'w-[90%] max-w-2xl': !isNavbarScrolled(),
      'open border-t border-b': isMobileMenuOpen()
    }"
  >
    <div class="mobile-menu-inner backdrop-blur-2xl bg-slate-950/95 shadow-2xl rounded-b-2xl">
      <div class="px-4 pt-3 pb-5 space-y-1.5">
        @for (item of navItems; track item.id) {
          <a
            (click)="onNavigate(item.id, $event)"
            [href]="item.href"
            class="block px-3.5 py-2.5 rounded-xl text-sm font-semibold tracking-wide transition-all duration-300 cursor-pointer border border-transparent"
            [class.bg-[#38bdf8]/15]="scrollService.activeSection() === item.id"
            [class.border-[#38bdf8]/40]="scrollService.activeSection() === item.id"
            [class.text-[#38bdf8]]="scrollService.activeSection() === item.id"
            [class.shadow-[0_0_12px_rgba(56,189,248,0.3)]]="scrollService.activeSection() === item.id"
            [class.text-neutral-300]="scrollService.activeSection() !== item.id"
            [class.hover:bg-white/5]="scrollService.activeSection() !== item.id"
            [class.hover:text-[#f1f5f9]]="scrollService.activeSection() !== item.id"
          >
            {{ item.label }}
          </a>
        }
      </div>
    </div>
  </div>
</nav>
